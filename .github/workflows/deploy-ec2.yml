
name: Deploy to EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Validate application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy application
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Install SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key

      - name: Add EC2 host key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -eu
          test -n "$EC2_HOST"
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and restart PM2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
          PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -eu
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_APP_DIR"
          test -n "$PM2_APP_NAME"
          test -n "$DEPLOY_SHA"

          ssh -i ~/.ssh/ec2_deploy_key \
            "$EC2_USER@$EC2_HOST" \
            "EC2_APP_DIR='$EC2_APP_DIR' PM2_APP_NAME='$PM2_APP_NAME' DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          cd "$EC2_APP_DIR"

          # Fetch the latest repository references.
          git fetch origin main

          # Refuse to overwrite local changes or an existing divergent checkout.
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "ERROR: Working tree has changes. Aborting deployment."
            exit 1
          fi

          # Switch to main, then check out the exact commit that triggered this run.
          git switch main
          git checkout --detach "$DEPLOY_SHA"

          echo "Deploying commit:"
          git log -1 --oneline

          cd app

          npm ci
          npm run build

          pm2 restart "$PM2_APP_NAME" --update-env
          pm2 save

          echo "Deployment completed successfully."
          REMOTE_SCRIPT
